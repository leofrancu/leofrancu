<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="253" viewBox="0 0 1000 253" fill="none"><style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style><rect x="0.5" y="0.5" width="999" height="252" rx="12" fill="#151b23" stroke="#30363d"/><defs><clipPath id="c"><rect x="0.5" y="0.5" width="999" height="252" rx="12"/></clipPath></defs><rect x="0" y="0" width="4" height="253" fill="#4493f8" clip-path="url(#c)"/><text x="36.0" y="46.0" class="s" font-size="11.5" font-weight="600" fill="#4493f8" letter-spacing="1.3">FEATURED RESEARCH · BSC THESIS</text><text x="36.0" y="86.0" class="s" font-size="24" font-weight="700" fill="#f0f6fc">User Behavior in Facebook Groups During Emergencies</text><text x="36.0" y="124.0" class="s" font-size="15.5" font-weight="400" fill="#c9d1d9">Using the Meta Secure Research Environment, I analyze how users interact in Facebook groups during disaster</text><text x="36.0" y="147.0" class="s" font-size="15.5" font-weight="400" fill="#c9d1d9">events, with the goal of identifying coordination patterns and how information spreads across the groups involved. The</text><text x="36.0" y="170.0" class="s" font-size="15.5" font-weight="400" fill="#c9d1d9">work is built on a real, large-scale dataset obtained through admission to Meta's researcher program.</text><line x1="36" y1="212" x2="964" y2="212" stroke="#262c36"/><text x="36.0" y="238.0" class="m" font-size="13" font-weight="400" fill="#9198a1">Meta Content Library · Python · pandas · geopandas</text></svg>