<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" fill="none"><style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style><rect x="0.5" y="0.5" width="999" height="339" rx="12" fill="#151b23" stroke="#30363d"/><text x="36.0" y="46.0" class="s" font-size="11.5" font-weight="600" fill="#4493f8" letter-spacing="1.3">FORMAZIONE</text><text x="36.0" y="88.0" class="m" font-size="13" font-weight="400" fill="#9198a1">09/2022 – 11/2026</text><text x="246.0" y="88.0" class="s" font-size="17" font-weight="700" fill="#f0f6fc">Università degli Studi di Torino</text><text x="246.0" y="112.0" class="s" font-size="15" font-weight="500" fill="#4493f8">Laurea Triennale in Informatica</text><text x="246.0" y="138.0" class="s" font-size="15" font-weight="400" fill="#c9d1d9">Percorso sui fondamenti dell'informatica, con approfondimenti in basi di dati, sviluppo web e</text><text x="246.0" y="160.0" class="s" font-size="15" font-weight="400" fill="#c9d1d9">ingegneria del software.</text><line x1="36" y1="206" x2="964" y2="206" stroke="#262c36"/><text x="36.0" y="232.0" class="m" font-size="13" font-weight="400" fill="#9198a1">09/2017 – 07/2022</text><text x="246.0" y="232.0" class="s" font-size="17" font-weight="700" fill="#f0f6fc">Istituto di Istruzione Superiore Primo Levi</text><text x="246.0" y="256.0" class="s" font-size="15" font-weight="500" fill="#4493f8">Diploma di Maturità Scientifica</text><text x="246.0" y="282.0" class="s" font-size="15" font-weight="400" fill="#c9d1d9">Voto finale 100/100. Percorso incentrato su scienze naturali, matematica e statistica. Partecipazione</text><text x="246.0" y="304.0" class="s" font-size="15" font-weight="400" fill="#c9d1d9">alle fasi regionali delle Olimpiadi di Matematica e di Fisica.</text></svg>