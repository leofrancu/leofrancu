<svg xmlns="http://www.w3.org/2000/svg" width="480" height="193" viewBox="0 0 480 193" fill="none"><style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style><rect x="0.5" y="0.5" width="479" height="192" rx="12" fill="#0d1117" stroke="#30363d" stroke-dasharray="5 5"/><text x="26.0" y="40.0" class="s" font-size="11.5" font-weight="600" fill="#9198a1" letter-spacing="1.3">PROGETTO D'ESAME</text><rect x="383" y="24" width="71" height="22" rx="11" fill="#1f3a5f"/><text x="418.5" y="39.0" class="s" font-size="11.5" font-weight="600" fill="#4493f8" text-anchor="middle">In arrivo</text><text x="26.0" y="70.0" class="s" font-size="20" font-weight="700" fill="#f0f6fc">Algoritmi e Strutture Dati</text><text x="26.0" y="104.0" class="s" font-size="14.5" font-weight="400" fill="#c9d1d9">Sarà pubblicato qui non appena terminerà l'edizione del corso</text><text x="26.0" y="125.0" class="s" font-size="14.5" font-weight="400" fill="#c9d1d9">e avrò l'autorizzazione a condividerlo.</text><line x1="26" y1="158" x2="454" y2="158" stroke="#262c36"/><text x="26.0" y="180.0" class="m" font-size="12.5" font-weight="400" fill="#9198a1">Non ancora pubblico</text></svg>