<rect x="0.5" y="0.5" width="479" height="255" rx="16" fill="url(#dots)"/>
<text x="26" y="42" class="f" font-size="12" font-weight="700" fill="#7fb0ff" letter-spacing="1.5">PROGRAMMAZIONE III</text><g transform="translate(432 25)"><rect width="22" height="22" rx="6" fill="#132247" stroke="#2a3e70"/><path transform="translate(-1 -1)" d="M7 17 17 7M9 7h8v8" stroke="#7fb0ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="26" y="76" class="f" font-size="22" font-weight="700" fill="#f1f5f9">Sistema mail client-server</text><text x="26" y="98" class="m" font-size="12" fill="#5f6f8f">UniTo-ProgIII-2025-26</text><text x="26" y="127" class="f" font-size="15" fill="#c7d2e3">Sistema di posta client-server che comunica tramite socket</text><text x="26" y="148" class="f" font-size="15" fill="#c7d2e3">TCP, con interfaccia desktop in JavaFX.</text><rect x="26.0" y="204" width="52.5" height="26" rx="13.0" fill="#132247" stroke="#2a3e70"/><text x="38.0" y="221.5" class="f" font-size="12.5" fill="#dbe7ff">Java</text><rect x="86.5" y="204" width="69.8" height="26" rx="13.0" fill="#132247" stroke="#2a3e70"/><text x="98.5" y="221.5" class="f" font-size="12.5" fill="#dbe7ff">JavaFX</text><rect x="164.3" y="204" width="51.0" height="26" rx="13.0" fill="#132247" stroke="#2a3e70"/><text x="176.3" y="221.5" class="f" font-size="12.5" fill="#dbe7ff">TCP</text></svg>