b0ff" fill-opacity="0.95"/><circle cx="937.2" cy="299.5" r="2.7" fill="#9fb3d9" fill-opacity="0.45"/><circle cx="787.6" cy="178.0" r="4" fill="none" stroke="#7fb0ff" stroke-width="1.5" class="pulse" style="animation-delay:0.00s"/><circle cx="856.6" cy="231.6" r="4" fill="none" stroke="#7fb0ff" stroke-width="1.5" class="pulse" style="animation-delay:1.05s"/></g><rect x="40" y="36" width="4" height="18" rx="2" fill="#3b82f6"/><text x="54" y="50" class="f" font-size="13" font-weight="700" fill="#7fb0ff" letter-spacing="1.8">FEATURED RESEARCH · BSC THESIS</text><text x="40" y="94" class="f" font-size="28" font-weight="700" fill="#f1f5f9">User Behavior in Facebook Groups During</text><text x="40" y="128" class="f" font-size="28" font-weight="700" fill="#f1f5f9">Emergencies</text><text x="40" y="166" class="f" font-size="16.5" fill="#c7d2e3">Inside the Meta Secure Research Environment, I analyze how users interact in</text><text x="40" y="191" class="f" font-size="16.5" fill="#c7d2e3">Facebook groups during disaster events, to identify coordination patterns and</text><text x="40" y="216" class="f" font-size="16.5" fill="#c7d2e3">how information spreads across the groups involved. Built on a real, large-scale</text><text x="40" y="241" class="f" font-size="16.5" fill="#c7d2e3">dataset accessed through Meta's researcher program.</text><rect x="40.0" y="268" width="155.1" height="28" rx="14.0" fill="#132247" stroke="#2a3e70"/><text x="52.0" y="286.7" class="f" font-size="13" fill="#dbe7ff">Meta Content Library</text><rect x="204.1" y="268" width="67.7" height="28" rx="14.0" fill="#132247" stroke="#2a3e70"/><text x="216.1" y="286.7" class="f" font-size="13" fill="#dbe7ff">Python</text><rect x="280.8" y="268" width="70.1" height="28" rx="14.0" fill="#132247" stroke="#2a3e70"/><text x="292.8" y="286.7" class="f" font-size="13" fill="#dbe7ff">pandas</text><rect x="359.9" y="268" width="93.5" height="28" rx="14.0" fill="#132247" stroke="#2a3e70"/><text x="371.9" y="286.7" class="