cle cx="787.6" cy="191.6" r="4" fill="none" stroke="#7fb0ff" stroke-width="1.5" class="pulse" style="animation-delay:0.00s"/><circle cx="856.6" cy="250.2" r="4" fill="none" stroke="#7fb0ff" stroke-width="1.5" class="pulse" style="animation-delay:1.05s"/></g><rect x="40" y="36" width="4" height="18" rx="2" fill="#3b82f6"/><text x="54" y="50" class="f" font-size="13" font-weight="700" fill="#7fb0ff" letter-spacing="1.8">RICERCA IN EVIDENZA · TESI DI LAUREA</text><text x="40" y="94" class="f" font-size="28" font-weight="700" fill="#f1f5f9">Comportamento degli utenti nei gruppi</text><text x="40" y="128" class="f" font-size="28" font-weight="700" fill="#f1f5f9">Facebook durante le emergenze</text><text x="40" y="166" class="f" font-size="16.5" fill="#c7d2e3">Nel Meta Secure Research Environment analizzo come gli utenti interagiscono</text><text x="40" y="191" class="f" font-size="16.5" fill="#c7d2e3">nei gruppi Facebook durante eventi calamitosi, per individuare pattern di</text><text x="40" y="216" class="f" font-size="16.5" fill="#c7d2e3">coordinamento e capire come le informazioni si diffondono tra i gruppi coinvolti. Il</text><text x="40" y="241" class="f" font-size="16.5" fill="#c7d2e3">lavoro si basa su un dataset reale su larga scala, ottenuto tramite il programma</text><text x="40" y="266" class="f" font-size="16.5" fill="#c7d2e3">per ricercatori di Meta.</text><rect x="40.0" y="293" width="155.1" height="28" rx="14.0" fill="#132247" stroke="#2a3e70"/><text x="52.0" y="311.7" class="f" font-size="13" fill="#dbe7ff">Meta Content Library</text><rect x="204.1" y="293" width="67.7" height="28" rx="14.0" fill="#132247" stroke="#2a3e70"/><text x="216.1" y="311.7" class="f" font-size="13" fill="#dbe7ff">Python</text><rect x="280.8" y="293" width="70.1" height="28" rx="14.0" fill="#132247" stroke="#2a3e70"/><text x="292.8" y="311.7" class="f" font-size="13" fill="#dbe7ff">pandas</text><rect x="359.9" y="293" width="93.5" height="28" rx="14.0" fill="#132247" stroke="#2a3