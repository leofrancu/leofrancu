<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="281" viewBox="0 0 1000 281" fill="none"><style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style><rect x="0.5" y="0.5" width="999" height="280" rx="12" fill="#151b23" stroke="#30363d"/><defs><clipPath id="c"><rect x="0.5" y="0.5" width="999" height="280" rx="12"/></clipPath></defs><rect x="0" y="0" width="4" height="281" fill="#4493f8" clip-path="url(#c)"/><text x="36.0" y="46.0" class="s" font-size="11.5" font-weight="600" fill="#4493f8" letter-spacing="1.3">CURRENTLY · INTERNSHIP</text><text x="36.0" y="86.0" class="s" font-size="24" font-weight="700" fill="#f0f6fc">Inventory Data Analyst Intern</text><text x="36.0" y="114.0" class="s" font-size="16" font-weight="500" fill="#9198a1">Faiveley Transport · a Wabtec company · Piossasco, Turin</text><text x="36.0" y="152.0" class="s" font-size="15.5" font-weight="400" fill="#c9d1d9">I've taken my first step from the classroom into industry at Faiveley Transport, part of the Wabtec group and a global supplier of</text><text x="36.0" y="175.0" class="s" font-size="15.5" font-weight="400" fill="#c9d1d9">railway systems. Here I'm putting data analysis to work on real inventory data, where clean numbers turn directly into better</text><text x="36.0" y="198.0" class="s" font-size="15.5" font-weight="400" fill="#c9d1d9">operational decisions.</text><line x1="36" y1="240" x2="964" y2="240" stroke="#262c36"/><text x="36.0" y="266.0" class="m" font-size="13" font-weight="400" fill="#9198a1">Since October 2026</text></svg>