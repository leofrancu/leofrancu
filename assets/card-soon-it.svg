<svg xmlns="http://www.w3.org/2000/svg" width="480" height="256" viewBox="0 0 480 256" fill="none" role="img">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#10204a"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.045"/>
  </pattern>
</defs>
<style>
  .f{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif;} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(5.5);opacity:0}}
  .in{animation:fade .9s ease-out both} .d1{animation-delay:.15s} .d2{animation-delay:.3s} .d3{animation-delay:.45s}
  .pulse{animation:pulse 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  
</style>
<rect x="0.5" y="0.5" width="479" height="255" rx="16" fill="url(#bg)" stroke="#5f6f8f" stroke-dasharray="6 6"/>
<rect x="0.5" y="0.5" width="479" height="255" rx="16" fill="url(#dots)"/>
<text x="26" y="42" class="f" font-size="12" font-weight="700" fill="#8b9bb8" letter-spacing="1.5">IN ARRIVO</text><text x="26" y="76" class="f" font-size="22" font-weight="700" fill="#c7d2e3">Sistemi Operativi · Algoritmi e</text><text x="26" y="103" class="f" font-size="22" font-weight="700" fill="#c7d2e3">Strutture Dati</text><text x="26" y="136" class="f" font-size="15" fill="#8b9bb8">Saranno pubblicati qui non appena terminerà l'edizione dei</text><text x="26" y="157" class="f" font-size="15" fill="#8b9bb8">corsi e avrò l'autorizzazione a condividerli.</text></svg>