<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" fill="none"><style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style><rect x="0.5" y="0.5" width="999" height="357" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><defs><clipPath id="c"><rect x="0.5" y="0.5" width="999" height="357" rx="12"/></clipPath></defs><rect x="0" y="0" width="4" height="358" fill="#0969da" clip-path="url(#c)"/><text x="36.0" y="46.0" class="s" font-size="11.5" font-weight="600" fill="#0969da" letter-spacing="1.3">FEATURED RESEARCH · BSC THESIS</text><path transform="translate(948 30) scale(0.72)" d="M7 17 17 7M9 7h8v8" stroke="#59636e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="36.0" y="86.0" class="s" font-size="24" font-weight="700" fill="#1f2328">Emotional Dynamics and Sharing Networks in Facebook Groups During</text><text x="36.0" y="117.0" class="s" font-size="24" font-weight="700" fill="#1f2328">Emergencies</text><text x="36.0" y="145.0" class="s" font-size="16" font-weight="500" fill="#59636e">A comparative analysis of sudden-onset and forecastable events</text><text x="36.0" y="183.0" class="s" font-size="15.5" font-weight="400" fill="#3d444d">Working inside Meta's Secure Research Environment, I collected 511,511 posts from public Facebook groups across eight</text><text x="36.0" y="206.0" class="s" font-size="15.5" font-weight="400" fill="#3d444d">recent disasters, from the 2023 Turkey–Syria earthquake to the Emilia-Romagna floods, and studied how the mix of reactions</text><text x="36.0" y="229.0" class="s" font-size="15.5" font-weight="400" fill="#3d444d">shifts with the post's communicative intent, the phase of the emergency and how much warning people had. Posts are</text><text x="36.0" y="252.0" class="s" font-size="15.5" font-weight="400" fill="#3d444d">classified with a zero-shot NLI model, and a sharing network between groups explores whether connected communities</text><text x="36.0" y="275.0" class="s" font-size="15.5" font-weight="400" fill="#3d444d">respond alike. The full pipeline is open-source.</text><line x1="36" y1="317" x2="964" y2="317" stroke="#e1e6eb"/><text x="36.0" y="343.0" class="m" font-size="13" font-weight="400" fill="#59636e">Meta Content Library · Python · pandas · SciPy · NetworkX · transformers</text></svg>