<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="276" viewBox="0 0 1000 276" fill="none"><style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style><rect x="0.5" y="0.5" width="999" height="275" rx="12" fill="#151b23" stroke="#30363d"/><defs><clipPath id="c"><rect x="0.5" y="0.5" width="999" height="275" rx="12"/></clipPath></defs><rect x="0" y="0" width="4" height="276" fill="#4493f8" clip-path="url(#c)"/><text x="36.0" y="46.0" class="s" font-size="11.5" font-weight="600" fill="#4493f8" letter-spacing="1.3">RICERCA IN EVIDENZA · TESI DI LAUREA</text><text x="36.0" y="86.0" class="s" font-size="24" font-weight="700" fill="#f0f6fc">Comportamento degli utenti nei gruppi Facebook durante le emergenze</text><text x="36.0" y="124.0" class="s" font-size="15.5" font-weight="400" fill="#c9d1d9">Nel Meta Secure Research Environment analizzo come gli utenti interagiscono nei gruppi Facebook durante eventi</text><text x="36.0" y="147.0" class="s" font-size="15.5" font-weight="400" fill="#c9d1d9">calamitosi, con l'obiettivo di individuare pattern di coordinamento e capire come le informazioni si diffondono tra i</text><text x="36.0" y="170.0" class="s" font-size="15.5" font-weight="400" fill="#c9d1d9">gruppi coinvolti. Il lavoro si basa su un dataset reale su larga scala, ottenuto tramite l'ammissione al programma per</text><text x="36.0" y="193.0" class="s" font-size="15.5" font-weight="400" fill="#c9d1d9">ricercatori di Meta.</text><line x1="36" y1="235" x2="964" y2="235" stroke="#262c36"/><text x="36.0" y="261.0" class="m" font-size="13" font-weight="400" fill="#9198a1">Meta Content Library · Python · pandas · geopandas</text></svg>